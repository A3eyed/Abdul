name: Abdul Health Check

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check Abdul endpoint
        id: check
        continue-on-error: true
        run: |
          # Set your Abdul public or Tailscale URL as a repository secret: ABDUL_HEALTH_URL
          # Example: https://your-vps-ip:8080/health  or  http://100.x.x.x:8080/health
          if [ -z "${{ secrets.ABDUL_HEALTH_URL }}" ]; then
            echo "ABDUL_HEALTH_URL secret not set — skipping live check"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.ABDUL_HEALTH_URL }}" || echo "000")
          echo "HTTP status: $status_code"

          if [ "$status_code" = "200" ]; then
            echo "status=ok" >> $GITHUB_OUTPUT
          else
            echo "status=down" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Report status
        run: |
          echo "Abdul health status: ${{ steps.check.outputs.status }}"

      # Optional: notify you when it is down
      # Uncomment and configure one of the options below later
