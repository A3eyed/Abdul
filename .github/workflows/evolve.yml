name: Abdul Self-Evolution

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Abdul
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai httpx pyyaml

      - name: Run Evolution Cycle
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE: "true"
        run: |
          python evolution/run_evolution.py

      - name: Create Evolution PR (if changes exist)
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Abdul autonomous evolution"
          title: "Abdul Self-Evolution Cycle"
          body: |
            Autonomous improvement generated by Abdul.
            No human approval required. Tests and safety checks have passed.
          branch: abdul-evolution-${{ github.run_id }}
          delete-branch: true

      - name: Auto-merge Evolution PR
        if: steps.create_pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
