name: Abdul Self-Evolution

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Abdul
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Run Evolution Cycle
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AUTO_MERGE: "true"
          REQUIRE_HUMAN_APPROVAL: "false"
        run: |
          python evolution/run_evolution.py

      - name: Create Evolution PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Abdul autonomous evolution"
          title: "Abdul self-evolution (auto-merge)"
          body: |
            ## Abdul self-evolution

            Generated automatically. **Auto-merged** per owner policy.

            Independence-first improvements preferred.
          branch: abdul-evolution-${{ github.run_id }}
          delete-branch: true
          labels: |
            evolution
            auto-merged

      - name: Auto-merge Evolution PR
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.create_pr.outputs.pull-request-number }}
          echo "Merging PR #$PR"
          # Prefer squash merge; fall back to merge commit
          gh pr merge "$PR" --squash --admin || gh pr merge "$PR" --merge --admin || gh pr merge "$PR" --squash || gh pr merge "$PR" --merge
