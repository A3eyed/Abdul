name: Abdul Self-Evolution

on:
  schedule:
    # Nightly proposal (UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:  # Manual: Actions → Abdul Self-Evolution → Run workflow

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Abdul
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Run Evolution Cycle (propose only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AUTO_MERGE: "false"
          REQUIRE_HUMAN_APPROVAL: "true"
        run: |
          python evolution/run_evolution.py

      - name: Create Evolution PR for human review
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Abdul evolution proposal (awaits human approval)"
          title: "Abdul evolution proposal — review before merge"
          body: |
            ## Abdul self-evolution proposal

            This PR was **generated by Abdul** and is **not merged automatically**.

            ### Your job
            1. Read the diff carefully
            2. Run or test anything that looks risky
            3. Merge only if you approve — or close / request changes

            ### Policy
            - Human inspection and approval required
            - No auto-merge
            - Independence-first improvements preferred
          branch: abdul-evolution-${{ github.run_id }}
          delete-branch: true
          labels: |
            evolution
            needs-human-review
